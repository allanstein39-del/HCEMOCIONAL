<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playlist Secreta — A História do Hardcore Emocional</title>
  <meta name="description" content="Uma playlist colaborativa secreta no Spotify. Adicione no máximo 10 músicas." />

  <!-- Página secreta: fora de buscadores e do sitemap -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicon / ícones -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0d0d0d" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #0d0d0d;
      --acid: #d3f74f;
      --paper: #f5f0e8;
      --mid: #2a2a2a;
      --spotify: #1ed760;
      --font-head: 'Bebas Neue', 'Arial Narrow', 'Helvetica Neue', Impact, sans-serif;
      --font-body: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--black); color: var(--paper);
      font-family: var(--font-body); font-size: 20px; line-height: 1.4;
      display: flex; align-items: center; justify-content: center; padding: 40px 16px;
    }
    main { width: 100%; max-width: 520px; text-align: center; }
    .logo { width: 120px; height: auto; margin-bottom: 32px; }
    .tag {
      display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .15em;
      text-transform: uppercase; color: var(--black); background: var(--acid); padding: 4px 10px;
    }
    h1 {
      font-family: var(--font-head); font-weight: 400; font-size: clamp(56px, 14vw, 88px);
      line-height: .9; margin: 20px 0 16px; letter-spacing: .01em;
    }
    p { margin: 0 0 12px; }
    .rules {
      list-style: none; margin: 28px 0 32px; padding: 20px; border: 1px solid var(--mid);
      text-align: left; font-family: var(--font-mono); font-size: 14px;
    }
    .rules li { padding: 6px 0; }
    .rules li::before { content: '→ '; color: var(--acid); }
    .rules strong { color: var(--acid); }
    .btn {
      display: inline-flex; align-items: center; gap: 12px; padding: 18px 32px;
      background: var(--spotify); color: var(--black); text-decoration: none;
      font-family: var(--font-head); font-size: 28px; letter-spacing: .04em; border-radius: 999px;
      transition: transform .15s ease, filter .15s ease;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:focus-visible { outline: 3px solid var(--acid); outline-offset: 4px; }
    .btn svg { width: 28px; height: 28px; flex: none; }
    .note { margin-top: 28px; font-family: var(--font-mono); font-size: 12px; color: #8a867f; }
  </style>
</head>
<body>
  <main>
    <a href="/"><img class="logo" src="/logo-dark-bg.webp" alt="A História do Hardcore Emocional" /></a>
    <div><span class="tag">Acesso secreto</span></div>
    <h1>Playlist Secreta</h1>
    <p>Você achou a playlist colaborativa escondida. Entra, ouve e deixa a sua marca nela.</p>

    <ul class="rules">
      <li>Playlist <strong>colaborativa</strong> no Spotify</li>
      <li>Adicione no <strong>máximo 10 músicas</strong></li>
      <li>Não compartilhe o link por aí 🤫</li>
    </ul>

    <!-- TROCAR: cole aqui o link da playlist colaborativa do Spotify -->
    <a class="btn" href="https://open.spotify.com/playlist/COLE_O_ID_AQUI" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.5 17.3a.75.75 0 0 1-1 .25c-2.85-1.74-6.43-2.13-10.66-1.17a.75.75 0 1 1-.33-1.46c4.62-1.05 8.6-.6 11.74 1.33.35.22.47.68.25 1.05zm1.47-3.26a.94.94 0 0 1-1.29.31c-3.26-2-8.23-2.58-12.09-1.41a.94.94 0 1 1-.54-1.8c4.4-1.33 9.88-.69 13.61 1.6.44.27.58.85.31 1.3zm.13-3.4C15.2 8.33 8.76 8.12 5.03 9.25a1.13 1.13 0 1 1-.65-2.16c4.28-1.3 11.4-1.05 15.9 1.62a1.13 1.13 0 0 1-1.18 1.93z"/></svg>
      Abrir no Spotify
    </a>

    <p class="note">Precisa estar logado no Spotify para adicionar músicas.</p>
  </main>
</body>
</html>
